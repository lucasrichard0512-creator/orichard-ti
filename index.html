  return {el:img,x,y,w:parseInt(img.style.width),h:parseInt(img.style.height),i}
 });
 const sceneInfo=[
  {name:'Abertura',screen:'legacy'},
  {name:'Computador lento',screen:'freeze',label:'01 / COMPUTADOR',title:'Seu sistema vive travando?',copy:'Cada parada atrasa a venda e o atendimento.',focus:[490,525,465,280],pin:[495,506]},
  {name:'Rede interna',screen:'legacy',label:'02 / REDE INTERNA',title:'Equipamentos sem comunicação?',copy:'Computador, impressora e equipamentos precisam trabalhar juntos.',focus:[839,657,245,198],pin:[843,676]},
  {name:'Armazenamento',screen:'storage',label:'03 / ARQUIVOS',title:'Não consegue salvar arquivos?',copy:'Espaço insuficiente e falhas de backup colocam informações em risco.',focus:[490,525,465,280],pin:[570,525]},
  {name:'Controles manuais',screen:'legacy',label:'04 / CONTROLES MANUAIS',title:'Fiado e estoque no papel?',copy:'Anotações espalhadas dificultam a organização e a conferência.',focus:[281,837,495,225],pin:[269,871]},
  {name:'Levantamento',screen:'legacy',caption:['A TRANSFORMAÇÃO COMEÇA','Do papel para o digital.']},
  {name:'Papéis ao monitor',screen:'black',caption:['TUDO EM UM SÓ LUGAR','Menos improviso. Mais controle.']},
  {name:'Controle+',screen:'control'},
  {name:'Controle+ em foco',screen:'control',focus:[495,520,470,280]}
 ];

 const clamp=(v,min=0,max=1)=>Math.min(max,Math.max(min,v));
 const lerp=(a,b,t)=>a+(b-a)*t;
 const ease=t=>1-Math.pow(1-clamp(t),3);
 const smooth=t=>{const x=clamp(t);return x*x*(3-2*x)};
 const segment=(p,a,b)=>smooth((p-a)/(b-a));
 const windowOpacity=(p,a,b,c,d)=>segment(p,a,b)*(1-segment(p,c,d));
 const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 const END=7.05;
 // Each focus is reached in approximately half a screen of scrolling.
 // The visitor may continue scrolling; no timers, locks, snapping or gesture queues.
 const beats=[
   {id:1,start:.18,settle:.53,hold:.91,home:1.19},
   {id:2,start:1.25,settle:1.57,hold:1.94,home:2.22},
   {id:3,start:2.28,settle:2.60,hold:2.96,home:3.24},
   {id:4,start:3.30,settle:3.62,hold:3.99,home:4.27}
 ];
 const chapterMarks=[0,.29,1.34,2.35,3.38,4.42,4.97,5.75,6.22];
 let W=stage.clientWidth,H=stage.clientHeight,cam=null;
 let shown=0,target=0,raf=0,lastFrame=0,chapter=-1,cardId=0,paperP=-1,cardAnchor=null,lastCaption="";
 function home(){let s,ox,oy;
  if(W<760){s=Math.min(W*.99/941,H*.96/1672,.48);ox=(W-941*s)/2;oy=H*.555-914*s}
  else{s=Math.min(W*.63/941,H*.93/1320,.83);ox=W*.66-485*s;oy=H*.59-840*s}
  return {s,ox,oy};
 }
 function focused(n){const f=sceneInfo[n].focus;if(!f)return home();const mobile=W<760;
  let s=Math.min((mobile?W*.91:W*.56)/f[2],(mobile?H*.48:H*.63)/f[3],mobile?1.28:1.32);
  const tx=mobile?W*.49:W*.47,ty=mobile?H*.60:H*.58;
  return {s,ox:tx-f[0]*s,oy:ty-f[1]*s};
 }
 function setCamera(c){cam=c;rig.style.transform=`translate3d(${c.ox.toFixed(2)}px,${c.oy.toFixed(2)}px,0) scale(${c.s.toFixed(5)})`}
 function opacity(el,a){const value=clamp(a);el.style.opacity=value.toFixed(3);el.style.visibility=value<.003?'hidden':'visible'}
 function cardContent(id){if(cardId===id)return;cardId=id;cardAnchor=null;if(!id)return;
  const sc=sceneInfo[id];$('code').textContent=sc.label;$('card-title').textContent=sc.title;$('card-copy').textContent=sc.copy;
  if(W>=760){card.style.width='min(340px,28vw)';card.style.left=Math.round(W*.73)+'px';card.style.top=Math.round(H*.31)+'px'}
  else{card.style.left='';card.style.top='';card.style.width=''}
 }
 function drawConnector(id){const [x,y]=sceneInfo[id].pin;
  const px=cam.ox+x*cam.s,py=cam.oy+y*cam.s;
  if(!cardAnchor){const a=card.getBoundingClientRect(),b=stage.getBoundingClientRect();
   cardAnchor=W<760?{x:a.left-b.left+a.width*.63,y:a.bottom-b.top}:{x:a.left-b.left,y:a.top-b.top+a.height*.57};
  }
  const x0=cardAnchor.x,y0=cardAnchor.y;
  const mx=W<760?x0+(px-x0)*.38:x0-(x0-px)*.40;
  const my=W<760?y0+(py-y0)*.30:Math.min(y0,py)-30;
  $('link-path').setAttribute('d',`M ${x0.toFixed(1)} ${y0.toFixed(1)} Q ${mx.toFixed(1)} ${my.toFixed(1)} ${px.toFixed(1)} ${py.toFixed(1)}`);
  $('link-a').setAttribute('cx',x0);$('link-a').setAttribute('cy',y0);
  $('link-b').setAttribute('cx',px);$('link-b').setAttribute('cy',py);
 }
 function papers(t){if(Math.abs(t-paperP)<.0001)return;paperP=t;paperNodes.forEach((el,i)=>{
  const lift=ease(clamp(t/.28));const dissolve=ease(clamp((t-.31)/.34));
  const wiggle=((i%2)?1:-1)*(3.5*lift+7*dissolve);
  const offsetX=Math.sin(i*2.4)*9*lift,offsetY=-34*lift-20*dissolve;
  el.style.transform=`translate3d(${offsetX.toFixed(2)}px,${offsetY.toFixed(2)}px,0) rotate(${wiggle.toFixed(2)}deg) scale(${(1-.22*dissolve).toFixed(3)})`;
  el.style.opacity=t>=.999?'0':(1-dissolve).toFixed(3);
 });
 leaves.forEach(({el,x,y,w,h,i})=>{
  const st=.29+(i%6)*.018;
  const travel=ease(clamp((t-st)/(1-st)));
  const dx=(478-(x+w*.5))*travel+(Math.sin(i*2.12)*29)*Math.sin(Math.PI*travel);
  const dy=(512-(y+h*.5))*travel-135*Math.sin(Math.PI*travel);
  const rotation=((i%2)?1:-1)*(16+125*travel)+i*13;
  const sc=.72+(i%4)*.11-(.71+(i%4)*.10)*travel;
  el.style.transform=`translate3d(${dx.toFixed(2)}px,${dy.toFixed(2)}px,0) rotate(${rotation.toFixed(2)}deg) scale(${Math.max(.04,sc).toFixed(3)})`;
  el.style.opacity=t<st?'0':(clamp(travel*12)*(1-ease(clamp((travel-.78)/.22)))).toFixed(3)
 });
 const glow=clamp((t-.42)/.22)*(1-clamp((t-.93)/.07));
 $('intake-glow').style.opacity=(glow*.82).toFixed(3);
 }

 function render(p){
  const base=home();let active=0,focusAmount=0;
  for(const b of beats){const z=segment(p,b.start,b.settle)*(1-segment(p,b.hold,b.home));
   if(z>focusAmount){focusAmount=z;active=b.id;}
  }
  const finalFocus=segment(p,6.10,6.56);
  let next=base;
  if(focusAmount>.0001){const f=focused(active);next={s:lerp(base.s,f.s,focusAmount),ox:lerp(base.ox,f.ox,focusAmount),oy:lerp(base.oy,f.oy,focusAmount)}}
  if(finalFocus>.0001){const f=focused(8);next={s:lerp(next.s,f.s,finalFocus),ox:lerp(next.ox,f.ox,finalFocus),oy:lerp(next.oy,f.oy,finalFocus)}}
  setCamera(next);
  // Hero never shares screen space with a diagnosis.
  opacity(hero,1-segment(p,.06,.31));
  hero.style.transform=`translateY(${(-10*segment(p,.06,.31)).toFixed(2)}px)`;
  let showId=0,cardAlpha=0;
  for(const b of beats){const a=windowOpacity(p,b.settle-.07,b.settle+.045,b.hold-.055,b.hold+.105);
   if(a>cardAlpha){showId=b.id;cardAlpha=a}
  }
  if(showId){cardContent(showId);card.style.transform=`translateY(${((1-cardAlpha)*11).toFixed(1)}px)`;opacity(card,cardAlpha);opacity(line,cardAlpha);drawConnector(showId)}
  else{opacity(card,0);opacity(line,0)}
  // Screen overlays are independent from the photograph and reversible on scroll up.
  const freeze=windowOpacity(p,.23,.41,1.00,1.19);
  const storage=windowOpacity(p,2.29,2.50,3.03,3.24);
  opacity($('screen-legacy'),1);
  opacity($('screen-freeze'),freeze);
  opacity($('screen-storage'),storage);
  opacity($('screen-black'),segment(p,5.12,5.61));
  opacity($('screen-control'),segment(p,5.77,6.05));
  // Rising papers -> clearly visible flight -> fully empty desk.
  const paperProgress=segment(p,4.35,5.63);
  papers(paperProgress);
  // Paper animation updates the intake glow and leaf opacity independently.
  const capA=windowOpacity(p,4.40,4.54,4.83,5.00),capB=windowOpacity(p,5.08,5.24,5.55,5.73);
  const capIsB=capB>capA;
  const nextCaption=capIsB?'absorb':'lift';
  if(lastCaption!==nextCaption){lastCaption=nextCaption;$('caption-kicker').textContent=capIsB?'TUDO EM UM SÓ LUGAR':'A TRANSFORMAÇÃO COMEÇA';$('caption-title').textContent=capIsB?'Menos improviso. Mais controle.':'Do papel para o digital.';}
  opacity(caption,Math.max(capA,capB));
  caption.style.transform=`translate(-50%,${(12*(1-Math.max(capA,capB))).toFixed(1)}px)`;
  const skipVisibility=1-segment(p,5.75,6.15);opacity($('skip'),.68*skipVisibility);$('skip').style.pointerEvents=skipVisibility>.2?'auto':'none';
  const done=segment(p,6.56,6.85);opacity(finish,done);finish.style.transform=`translateY(${((1-done)*14).toFixed(1)}px)`;
  finish.style.pointerEvents=done>.65?'auto':'none';
  let n=0;for(let i=chapterMarks.length-1;i>=0;i--){if(p>=chapterMarks[i]){n=i;break}}
  if(n!==chapter){chapter=n;$('n').textContent=String(n+1).padStart(2,'0');[...$('rail').children].forEach((el,i)=>el.classList.toggle('active',i===n));$('announcement').textContent=sceneInfo[n].name}
 }
 function needsFrame(){if(!raf)raf=requestAnimationFrame(frame)}
 function frame(now){raf=0;if(!lastFrame)lastFrame=now;
  const dt=Math.min(.048,Math.max(.001,(now-lastFrame)/1000));lastFrame=now;
  if(reduced){shown=target}else{
   const dif=target-shown;
   // Large/continuous swipes keep moving fluidly; cap visual velocity to
   // avoid vanishing cards, instead of locking input or snapping chapters.
   const inFocus=beats.some(b=>shown>=b.settle&&shown<=b.hold);
   const speed=inFocus?1.04:1.72;   // viewport-height units per second
   const desired=dif*(1-Math.exp(-12*dt));
   shown+=clamp(desired,-speed*dt,speed*dt);
   if(Math.abs(dif)<.0007)shown=target;
  }
  render(shown);
  if(Math.abs(target-shown)>.0007)needsFrame();else lastFrame=0;
 }
 function progressFromScroll(){target=clamp(scroller.scrollTop/Math.max(1,H),0,END);needsFrame()}
 scroller.addEventListener('scroll',progressFromScroll,{passive:true});
 function resize(){const oldH=H;W=stage.clientWidth;H=stage.clientHeight;cardAnchor=null;
  $('scroll-length').style.height=`${(END+1)*H}px`;
  if(oldH&&oldH!==H){scroller.scrollTop=target*H}
  target=clamp(scroller.scrollTop/Math.max(1,H),0,END);render(shown);needsFrame();
 }
 window.addEventListener('resize',resize,{passive:true});
 window.addEventListener('orientationchange',()=>setTimeout(resize,120),{passive:true});
 const skip=$('skip');skip.addEventListener('click',e=>{e.preventDefault();scroller.scrollTo({top:END*H,behavior:reduced?'instant':'smooth'})});
 window.addEventListener('keydown',e=>{if(e.target.closest('a,button,input,textarea'))return;
  if(e.key==='Home'||e.key==='End'){e.preventDefault();scroller.scrollTo({top:e.key==='Home'?0:END*H,behavior:'smooth'})}
 });
 // Ready for automation / deterministic screenshots; query p=2.70 positions timeline directly.
 window.__qaRender=p=>{shown=target=clamp(p,0,END);scroller.scrollTop=shown*H;render(shown)};
 const urlP=new URLSearchParams(location.search).get('p');
 resize();papers(0);render(0);
 if(urlP!==null&&Number.isFinite(Number(urlP))){scroller.scrollTop=clamp(Number(urlP),0,END)*H;shown=target=clamp(Number(urlP),0,END);render(shown)}
})();
