 const value=key=>{const m0=(b[key]-pre[key])/Math.max(.001,b.p-pre.p)*.64;const m1=(post[key]-a[key])/Math.max(.001,post.p-a.p)*.64;
 return h00*a[key]+h10*span*m0+h01*b[key]+h11*span*m1;};
 return {s:value('s'),ox:value('ox'),oy:value('oy'),r:value('r')};}
function setCamera(c){camera=c;rig.style.transform=`translate3d(${c.ox.toFixed(2)}px,${c.oy.toFixed(2)}px,0) rotate(${c.r.toFixed(3)}deg) scale(${c.s.toFixed(5)})`}
function project(x,y){const sn=Math.sin(rad(camera.r)),cs=Math.cos(rad(camera.r));return {x:camera.ox+(x*cs-y*sn)*camera.s,y:camera.oy+(x*sn+y*cs)*camera.s}}
function opacity(el,v){v=clamp(v);el.style.opacity=v.toFixed(3);el.style.visibility=v<.003?'hidden':'visible'}
function updateCard(id){if(id===cardCurrent)return;cardCurrent=id;cardAnchor=null;if(!id)return;const d=data[id];$('card-kicker').textContent=d.eyebrow;$('card-title').textContent=d.title;$('card-copy').textContent=d.copy;card.classList.toggle('warning',d.warning);
 if(W>=760){card.style.left=clamp(W*.073,68,112)+'px';card.style.top=clamp(H*.30,204,295)+'px';card.style.width=Math.min(400,W*.30)+'px';}else{card.style.left='';card.style.top='';card.style.width='';}
}
function drawLine(id){const pos=project(...data[id].pin);if(!cardAnchor){const a=card.getBoundingClientRect(),b=stage.getBoundingClientRect();cardAnchor=W<760?{x:a.left-b.left+a.width*.55,y:a.bottom-b.top}:{x:a.right-b.left,y:a.top-b.top+a.height*.61};}
 const st=cardAnchor,mx=W<760?(st.x+pos.x)*.50:(st.x+pos.x)*.51,my=W<760?st.y+(pos.y-st.y)*.27:Math.min(pos.y,st.y)-26;
 $('connector-path').setAttribute('d',`M${st.x.toFixed(1)},${st.y.toFixed(1)} Q${mx.toFixed(1)},${my.toFixed(1)} ${pos.x.toFixed(1)},${pos.y.toFixed(1)}`);
 $('connector-start').setAttribute('cx',st.x);$('connector-start').setAttribute('cy',st.y);$('connector-end').setAttribute('cx',pos.x);$('connector-end').setAttribute('cy',pos.y);
}
function movePapers(p){if(Math.abs(p-paperProg)<.0001)return;paperProg=p;paperNodes.forEach((el,i)=>{
 const lift=seg(p,0,.30),dissolve=seg(p,.28,.51),sign=i%2?1:-1;
 const x=(Math.sin(i*2.4)*14)*lift+(478-origins[i][0])*dissolve*.17;
 const y=-52*lift-34*dissolve;
 el.style.transform=`translate3d(${x.toFixed(2)}px,${y.toFixed(2)}px,0) rotate(${(sign*(4*lift+15*dissolve)).toFixed(2)}deg) scale(${(1-.28*dissolve).toFixed(3)})`;
 el.style.opacity=(p>=.999?0:1-dissolve).toFixed(3);
 });
 leaves.forEach(({el,i,x,y,w,h})=>{
  const start=.26+(i%7)*.014,flight=seg(p,start,.96),bend=Math.sin(Math.PI*flight);
  const dx=(478-x-w/2)*flight+Math.sin(2.34*i)*46*bend;
  const dy=(517-y-h/2)*flight-150*bend;
  const sc=.79+(i%4)*.10-(.73+(i%4)*.09)*flight;
  const spin=(i%2?1:-1)*(12+143*flight)+i*9;
  el.style.transform=`translate3d(${dx.toFixed(2)}px,${dy.toFixed(2)}px,0) rotate(${spin.toFixed(2)}deg) scale(${Math.max(.035,sc).toFixed(3)})`;
  el.style.opacity=p<start?'0':(clamp(flight*13)*(1-seg(flight,.74,1))).toFixed(3);
 });
 opacity($('intake-glow'),seg(p,.38,.61)*(1-seg(p,.89,1))*.75);
}
function render(p){
 let c=cameraAt(p);
 // The world steadily descends behind the text, without yanking the camera away from its focus.
 const drift=sm(p/END), finalCompensate=1-.59*seg(p,6.24,6.72), extraY=(W<760?135:98)*drift*finalCompensate;
 c={...c,ox:c.ox-(W<760?6:12)*drift,oy:c.oy+extraY};
 setCamera(c);
 const focusBeats=beats.map(b=>({id:b.id,a:win(p,b.enter,b.read,b.hold,b.exit)}));
 let strongest={id:0,a:0};for(const b of focusBeats)if(b.a>strongest.a)strongest=b;
 $('lens-shade').style.setProperty('--fx',`${(W<760?52:68)}%`);
 $('lens-shade').style.setProperty('--fy',`${(W<760?65:58)}%`);
 opacity($('lens-shade'),strongest.a*(W<760?.31:.28));
 opacity(hero,1-seg(p,.10,.44));hero.style.transform=`translate3d(0,${(-28*seg(p,.10,.44)).toFixed(2)}px,0)`;
 if(strongest.id){updateCard(strongest.id);opacity(card,strongest.a);opacity(connector,strongest.a);card.setAttribute('aria-hidden',strongest.a>.5?'false':'true');card.style.transform=`translate3d(0,${((1-strongest.a)*24+Math.sin(p*2.1)*3*strongest.a).toFixed(2)}px,0)`;drawLine(strongest.id)}
 else{opacity(card,0);opacity(connector,0);card.setAttribute('aria-hidden','true')}
 const screenFreeze=win(p,.26,.48,1.01,1.18),screenStorage=win(p,2.36,2.58,3.03,3.21);
 opacity(lcds.legacy,1);opacity(lcds.freeze,screenFreeze);opacity(lcds.storage,screenStorage);
 opacity(lcds.black,seg(p,5.23,5.72));opacity(lcds.control,seg(p,5.88,6.22));
 opacity($('lcd-glow'),seg(p,5.90,6.22)*.08);
 movePapers(seg(p,4.37,5.69));
 const capA=win(p,4.44,4.60,4.85,5.04),capB=win(p,5.09,5.25,5.61,5.81);
 const type=capB>capA?'absorb':'lift';if(type!==lastInter){lastInter=type;$('inter-eyebrow').textContent=type==='lift'?'A TRANSFORMAÇÃO COMEÇA':'UMA NOVA ROTINA';$('inter-title').textContent=type==='lift'?'Do papel para o digital.':'Menos improviso. Mais controle.';}
 const cap=Math.max(capA,capB);opacity(intertitle,cap);intertitle.style.transform=`translate3d(-50%,${((1-cap)*21).toFixed(2)}px,0)`;
 const fin=seg(p,6.70,7.09);opacity(finalCopy,fin);finalCopy.setAttribute('aria-hidden',fin>.5?'false':'true');finalCopy.style.transform=`translate3d(0,${((1-fin)*24).toFixed(2)}px,0)`;finalCopy.style.pointerEvents=fin>.6?'auto':'none';
 $('light-orb').style.transform=`translate3d(${(-50+14*drift-strongest.a*8).toFixed(1)}%,${(-50+6*drift).toFixed(1)}%,0) scale(${(1+.09*Math.sin(p*1.9)).toFixed(3)})`;
 $('progress-fill').style.height=(p/END*100).toFixed(3)+'%';
 let n=0;for(let i=sceneMarks.length-1;i>=0;i--){if(p>=sceneMarks[i]){n=i;break}}
 if(n!==currentChapter){currentChapter=n;$('scene-number').textContent=String(n+1).padStart(2,'0');$('access-live').textContent=data[n].name;}
}
function requestFrame(){if(!raf)raf=requestAnimationFrame(tick)}
function tick(now){raf=0;const dt=last?Math.min(.048,(now-last)/1000):.016;last=now;const diff=target-shown;
 if(reduced)shown=target;else{const focus=beats.some(b=>shown>b.read&&shown<b.hold),maxSpeed=(focus?1.45:2.1);const shift=diff*(1-Math.exp(-9.5*dt));shown+=clamp(shift,-maxSpeed*dt,maxSpeed*dt);if(Math.abs(diff)<.0007)shown=target;}
 render(shown);if(Math.abs(target-shown)>.0007)requestFrame();else last=0;
}
function syncScroll(){target=clamp(scrollport.scrollTop/Math.max(1,H),0,END);requestFrame()}
function resize(){const prevH=H;W=stage.clientWidth;H=stage.clientHeight;$('scroll-length').style.height=`${Math.ceil(END+1)*H}px`;rebuildTrack();cardAnchor=null;
 if(prevH&&prevH!==H){scrollport.scrollTop=target*H}target=clamp(scrollport.scrollTop/Math.max(1,H),0,END);render(shown);requestFrame();}
scrollport.addEventListener('scroll',syncScroll,{passive:true});window.addEventListener('resize',resize,{passive:true});window.addEventListener('orientationchange',()=>setTimeout(resize,160),{passive:true});
window.__qaRender=p=>{shown=target=clamp(p,0,END);scrollport.scrollTop=shown*H;render(shown)};
resize();render(0);
const queryP=new URLSearchParams(location.search).get('p');if(queryP!==null&&Number.isFinite(Number(queryP)))window.__qaRender(Number(queryP));
})();
