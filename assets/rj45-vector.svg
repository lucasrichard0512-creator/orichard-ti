<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820" fill="none" role="img" aria-label="Cabo de rede RJ45 verde em perspectiva">
  <defs>
    <linearGradient id="cable" x1="180" y1="20" x2="920" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d8ff62"/>
      <stop offset=".42" stop-color="#b8ff35"/>
      <stop offset="1" stop-color="#72a914"/>
    </linearGradient>
    <linearGradient id="cableShade" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#263216"/>
      <stop offset="1" stop-color="#0c1108"/>
    </linearGradient>
    <linearGradient id="boot" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#d9ff61"/>
      <stop offset=".5" stop-color="#a9eb28"/>
      <stop offset="1" stop-color="#5c8f10"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fff2a6"/>
      <stop offset=".45" stop-color="#f0c23d"/>
      <stop offset="1" stop-color="#a26b00"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f8fff9" stop-opacity=".78"/>
      <stop offset=".55" stop-color="#b7d3c1" stop-opacity=".34"/>
      <stop offset="1" stop-color="#1a241d" stop-opacity=".68"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="220%" height="240%">
      <feDropShadow dx="0" dy="30" stdDeviation="24" flood-color="#000" flood-opacity=".78"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <!-- brilho ambiente -->
  <ellipse cx="820" cy="612" rx="260" ry="180" fill="#baff36" fill-opacity=".13" filter="url(#glow)"/>

  <!-- cabo em S -->
  <g filter="url(#shadow)">
    <path d="M420 -45C302 45 309 139 438 175C614 224 642 291 536 355C421 424 436 518 604 535C716 546 779 579 841 630"
      stroke="url(#cableShade)" stroke-width="78" stroke-linecap="round"/>
    <path d="M420 -45C302 45 309 139 438 175C614 224 642 291 536 355C421 424 436 518 604 535C716 546 779 579 841 630"
      stroke="url(#cable)" stroke-width="60" stroke-linecap="round"/>
    <path d="M399 -18C326 50 339 113 434 144C583 192 620 254 548 315"
      stroke="#f5ffd4" stroke-opacity=".35" stroke-width="8" stroke-linecap="round"/>

    <!-- capa traseira verde -->
    <g transform="translate(740 515) rotate(18)">
      <path d="M0 58L136 18L230 76L190 190L42 204L-28 144Z" fill="url(#boot)" stroke="#b9ff35" stroke-width="8"/>
      <path d="M28 70L146 39L196 72L164 107L54 128L4 113Z" fill="#75aa18" opacity=".72"/>
      <g stroke="#5b8412" stroke-width="12" stroke-linecap="round">
        <path d="M18 74L62 187"/><path d="M46 66L88 194"/><path d="M75 58L116 197"/><path d="M104 50L145 194"/>
      </g>
      <path d="M157 41L250 90L220 176L177 156L190 88L143 64Z" fill="#88c51c"/>

      <!-- plugue translúcido -->
      <g transform="translate(174 70)">
        <path d="M0 0L110 20L180 78L152 175L38 159L-18 93Z" fill="url(#glass)" stroke="#dffff0" stroke-opacity=".72" stroke-width="7"/>
        <path d="M110 20L180 78L152 175L128 103L64 63Z" fill="#dcefe4" fill-opacity=".17"/>
        <path d="M-18 93L38 159L152 175L128 103L64 63Z" fill="#0c120e" fill-opacity=".45"/>

        <!-- contatos dourados -->
        <g transform="translate(92 89) rotate(8)">
          <rect x="0" y="0" width="10" height="70" rx="3" fill="url(#gold)"/>
          <rect x="13" y="1" width="10" height="69" rx="3" fill="url(#gold)"/>
          <rect x="26" y="2" width="10" height="68" rx="3" fill="url(#gold)"/>
          <rect x="39" y="3" width="10" height="67" rx="3" fill="url(#gold)"/>
          <rect x="52" y="4" width="10" height="66" rx="3" fill="url(#gold)"/>
          <rect x="65" y="5" width="10" height="65" rx="3" fill="url(#gold)"/>
          <rect x="78" y="6" width="10" height="64" rx="3" fill="url(#gold)"/>
          <rect x="91" y="7" width="10" height="63" rx="3" fill="url(#gold)"/>
        </g>

        <!-- fios internos -->
        <g stroke-linecap="round" stroke-width="7">
          <path d="M10 52L92 83" stroke="#f2f1ea"/>
          <path d="M15 64L94 94" stroke="#ff7b39"/>
          <path d="M20 76L96 105" stroke="#62b04a"/>
          <path d="M24 88L98 116" stroke="#4d7fce"/>
        </g>

        <!-- trava -->
        <path d="M36 5L106 16L134 48L108 62L88 43L44 39L18 58L3 41Z" fill="#d8ff68" stroke="#b8ff35" stroke-width="6"/>
        <path d="M45 17L101 25L120 45" stroke="#f2ffd2" stroke-opacity=".55" stroke-width="5" stroke-linecap="round"/>
      </g>
    </g>
  </g>
</svg>
