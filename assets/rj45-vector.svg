<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" fill="none" role="img" aria-label="Cabo de rede RJ45 vetorial">
  <defs>
    <linearGradient id="cable" x1="980" y1="480" x2="360" y2="130" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5c8617"/>
      <stop offset=".45" stop-color="#c7ff42"/>
      <stop offset="1" stop-color="#8fc52b"/>
    </linearGradient>
    <linearGradient id="boot" x1="560" y1="130" x2="410" y2="315" gradientUnits="userSpaceOnUse">
      <stop stop-color="#252b28"/>
      <stop offset="1" stop-color="#070908"/>
    </linearGradient>
    <linearGradient id="plug" x1="420" y1="170" x2="130" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d8e8df" stop-opacity=".9"/>
      <stop offset=".55" stop-color="#779087" stop-opacity=".52"/>
      <stop offset="1" stop-color="#26322e" stop-opacity=".82"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fff1a0"/>
      <stop offset=".45" stop-color="#e9bd32"/>
      <stop offset="1" stop-color="#8b5c00"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="180%" height="190%">
      <feDropShadow dx="0" dy="24" stdDeviation="18" flood-color="#000" flood-opacity=".72"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- cabo longo e curvado, vindo da direita -->
    <path d="M1025 510C844 552 690 520 632 420C585 340 651 278 730 252C812 225 878 174 841 107C804 39 669 63 563 129L510 163" stroke="#baff39" stroke-opacity=".16" stroke-width="94" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M1025 510C844 552 690 520 632 420C585 340 651 278 730 252C812 225 878 174 841 107C804 39 669 63 563 129L510 163" stroke="url(#cable)" stroke-width="58" stroke-linecap="round"/>
    <path d="M1008 486C851 523 716 494 661 409" stroke="#efffb8" stroke-opacity=".32" stroke-width="7" stroke-linecap="round"/>

    <!-- capa traseira do plugue -->
    <path d="M560 112L643 157L559 285L474 235Z" fill="url(#boot)" stroke="#424b46" stroke-width="5"/>
    <path d="M537 123L612 164L548 262L485 227Z" fill="#0a0d0b"/>
    <g stroke="#58615c" stroke-width="7" stroke-linecap="round" opacity=".8">
      <path d="M548 148L589 170"/><path d="M532 171L574 193"/><path d="M516 194L558 216"/><path d="M500 217L541 239"/>
    </g>

    <!-- corpo principal do RJ45 em perspectiva, ponta para a esquerda -->
    <path d="M487 205L430 157L190 195L104 268L136 381L342 411L470 327Z" fill="url(#plug)" stroke="#dff2e8" stroke-opacity=".72" stroke-width="6"/>
    <path d="M104 268L136 381L342 411L332 301L170 274Z" fill="#111816" fill-opacity=".68" stroke="#dff2e8" stroke-opacity=".38" stroke-width="5"/>
    <path d="M190 195L430 157L487 205L332 301L170 274L104 268Z" fill="#eefbf4" fill-opacity=".15" stroke="#f3fff9" stroke-opacity=".42" stroke-width="5"/>

    <!-- face frontal esquerda com oito contatos visíveis -->
    <path d="M104 268L170 274L136 381L82 345L76 294Z" fill="#dcebe4" fill-opacity=".2" stroke="#edfdf5" stroke-opacity=".65" stroke-width="5"/>
    <g transform="translate(91 287) skewY(9)">
      <rect x="0" y="0" width="8" height="52" rx="2" fill="url(#gold)"/>
      <rect x="11" y="0" width="8" height="52" rx="2" fill="url(#gold)"/>
      <rect x="22" y="0" width="8" height="52" rx="2" fill="url(#gold)"/>
      <rect x="33" y="0" width="8" height="52" rx="2" fill="url(#gold)"/>
      <rect x="44" y="0" width="8" height="52" rx="2" fill="url(#gold)"/>
      <rect x="55" y="0" width="8" height="52" rx="2" fill="url(#gold)"/>
      <rect x="66" y="0" width="8" height="52" rx="2" fill="url(#gold)"/>
      <rect x="77" y="0" width="8" height="52" rx="2" fill="url(#gold)"/>
    </g>

    <!-- fios internos -->
    <g stroke-linecap="round" stroke-width="8">
      <path d="M441 210L263 231" stroke="#f5f0df"/>
      <path d="M446 222L258 244" stroke="#f17934"/>
      <path d="M442 235L252 257" stroke="#62ac46"/>
      <path d="M432 248L246 269" stroke="#4278c3"/>
    </g>

    <!-- trava característica do RJ45 -->
    <path d="M372 169L455 167L496 196L452 211L415 191L354 199L319 228L298 217L337 181Z" fill="#d9ebe2" fill-opacity=".55" stroke="#f2fff8" stroke-opacity=".72" stroke-width="5"/>
    <path d="M353 184L420 178L467 197L448 203L414 187L358 194L329 217" stroke="#ffffff" stroke-opacity=".45" stroke-width="5" stroke-linecap="round"/>

    <!-- detalhes geométricos, inspirados no ícone de referência -->
    <path d="M407 260L455 234L466 284L423 310Z" fill="#0c100e" stroke="#6e7a73" stroke-width="4"/>
    <path d="M198 213L237 207L220 232L181 238Z" fill="#c7ff42" fill-opacity=".5"/>
    <path d="M137 378L337 405" stroke="#f4fff9" stroke-opacity=".28" stroke-width="4"/>
  </g>
</svg>
